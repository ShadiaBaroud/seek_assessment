version: "3.8"

services:
  api:
    image: seek-traffic-api:latest
    build:
      context: .
    container_name: traffic-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      #- LOG_LEVEL=INFO
      - API_BASE_URL=http://api:8000
    volumes:
      - .:/app
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    image: seek-traffic-dashboard:latest
    build:
      context: .
    container_name: traffic-dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      - API_BASE_URL=http://api:8000
    volumes:
      - .:/app
    command: streamlit run dashboard.py --server.address 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
